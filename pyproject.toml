[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lanmark"
version = "0.1.0"
description = "LAN device inventory, reliability monitoring and statistical incident detection"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.12,<1", "uvicorn>=0.34.2,<1", "httpx>=0.28.1,<1",
  "pydantic>=2.11.4,<3", "PyYAML>=6.0.2,<7", "prometheus-client>=0.22,<1",
]

[project.optional-dependencies]
agent = ["scapy>=2.6.1,<3", "dnspython>=2.7,<3"]

[tool.setuptools.packages.find]
include = ["lanmark*"]
