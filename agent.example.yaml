# Native Linux host; use `ip -br addr` to find the actual LAN interface.
source: home-wifi
interface: wlan0
cidr: 192.168.1.0/24
interval_seconds: 30
dns_query: example.com
targets:
  - {name: router, kind: gateway, address: 192.168.1.1}
  - {name: cloudflare, kind: isp, address: 1.1.1.1}
  - {name: google, kind: isp, address: 8.8.8.8}
  - {name: router-dns, kind: dns, address: 192.168.1.1}
